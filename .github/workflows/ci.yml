name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test -race ./...

      # A test that writes golden files as a side effect is the only way CI
      # could silently accept a rendering change. Fail if the tree moved.
      - name: golden files unchanged
        run: git diff --exit-code -- internal/tui/testdata

  screens:
    name: screen reference lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The reference grids are Milestone 0's render target and the source of
      # the golden files. They were committed with ragged borders and an
      # over-width row; this keeps that from recurring.
      - name: lint character grids
        run: python3 scripts/lint-screens.py
