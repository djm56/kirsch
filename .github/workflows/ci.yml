name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every job's steps live in scripts/ci.sh, so `bash scripts/ci.sh <job>` runs
  # the same commands locally. Checkout and setup-go stay here: the runner needs
  # the repository and Go, and setup-go installs the version on go.mod's `go`
  # line, which scripts/ci.sh reads the same way to pin a local run to it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/ci.sh mirrors setup-go@v5's version choice with GOTOOLCHAIN=
      # go<X.Y.Z>+auto. Revisit that parity if setup-go moves past v5: v6 sets
      # GOTOOLCHAIN=local (setup-go PR #460).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt, go vet, then golangci-lint. .golangci.yml is a v2 config, so the
      # binary has to be v2, and the version is pinned concretely so a linter
      # release cannot turn a green branch red on its own. The pin lives in
      # scripts/golangci-lint-version, the one place that names it. The script
      # installs that release binary rather than using golangci-lint-action
      # (which could read the pin through its version-file input) so that local
      # and CI run lint through one command, `ci.sh lint`; keeping the action
      # would split lint into two invocations. Given up: the action's analysis
      # cache and its config verification. Bump the pin when the gap to the
      # latest release matters.
      - name: lint
        run: bash scripts/ci.sh lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go test -race, the architecture rules (plan §2's dependency rules are
      # enforced by a test, not by review), and a check that the golden files
      # did not change: a test that writes golden files as a side effect is the
      # only way CI could silently accept a rendering change.
      - name: test
        run: bash scripts/ci.sh test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck (known vulnerabilities in dependencies and in the standard
      # library, with reachability analysis), gosec, the committed-credentials
      # scan, and the fuzz seed corpus. govulncheck and gosec are installed
      # @latest, so results move with advisory-database and tool releases. That
      # is intended: it is how the toolchain pin in go.mod gets maintained, a new
      # advisory fails the build instead of waiting to be noticed.
      - name: security
        run: bash scripts/ci.sh security

  screens:
    name: screen reference lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The reference grids are Milestone 0's render target and the source of
      # the golden files. They were committed with ragged borders and an
      # over-width row; this keeps that from recurring.
      - name: lint character grids
        run: bash scripts/ci.sh screens
