name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test -race -timeout 5m ./...

      # Plan §2's dependency rules are enforced by a test, not by review. Run
      # explicitly as well as via ./... so a failure names itself in the log.
      - name: architecture rules
        run: go test -run TestImportRules ./internal/arch/

      # A test that writes golden files as a side effect is the only way CI
      # could silently accept a rendering change. Fail if the tree moved.
      - name: golden files unchanged
        run: git diff --exit-code -- internal/tui/testdata

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Known vulnerabilities in dependencies and in the standard library,
      # with reachability analysis so it reports what this code actually calls.
      # This is how the toolchain pin in go.mod gets maintained: a new advisory
      # fails the build instead of waiting to be noticed.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Static analysis. Every finding is either fixed or carries a #nosec with
      # a written reason; an unannotated finding fails the job.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -exclude-generated ./...

      - name: committed credentials
        run: bash scripts/secret-scan.sh

      # The seed corpus only. Real fuzzing is `npm run fuzz`, run deliberately
      # rather than on every push — but a committed crasher must never regress.
      - name: fuzz corpus
        run: go test -run 'Fuzz' ./...

  screens:
    name: screen reference lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The reference grids are Milestone 0's render target and the source of
      # the golden files. They were committed with ragged borders and an
      # over-width row; this keeps that from recurring.
      - name: lint character grids
        run: python3 scripts/lint-screens.py
